module_name: ekf2
parameters:
- group: RESEARCH
  definitions:
    EKFR_1_GPS_V_N:
      description:
        short: Measurement noise for GNSS velocity for research instance 1 (Dimitris)
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKFR_2_GPS_V_N:
      description:
        short: Measurement noise for GNSS velocity for research instance 2 (Dimitris)
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKFR_3_GPS_V_N:
      description:
        short: Measurement noise for GNSS velocity for research instance 3 (Dimitris)
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKFR_1_GPS_P_N:
      description:
        short: Measurement noise for GNSS position for research instance 1 (Dimitris)
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKFR_2_GPS_P_N:
      description:
        short: Measurement noise for GNSS position for reserach instance 2 (Dimitris)
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKFR_3_GPS_P_N:
      description:
        short: Measurement noise for GNSS position for reserach instance 3 (Dimitris)
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKFR_1_HGT_REF:
      description:
        short: Determines the reference source of height data used by the EKFR (Dimitris)
        long: When multiple height sources are enabled at the same time, the height
          estimate will always converge towards the reference height source selected
          by this parameter. The range sensor and vision options should only be used
          when for operation over a flat surface as the local NED origin will move
          up and down with ground level.
      type: enum
      values:
        0: Barometric pressure
        1: GPS
        2: Range sensor
        3: Vision
      default: 1
      reboot_required: true
    EKFR_2_HGT_REF:
      description:
        short: Determines the reference source of height data used by the EKFR (Dimitris)
        long: When multiple height sources are enabled at the same time, the height
          estimate will always converge towards the reference height source selected
          by this parameter. The range sensor and vision options should only be used
          when for operation over a flat surface as the local NED origin will move
          up and down with ground level.
      type: enum
      values:
        0: Barometric pressure
        1: GPS
        2: Range sensor
        3: Vision
      default: 1
      reboot_required: true
    EKFR_3_HGT_REF:
      description:
        short: Determines the reference source of height data used by the EKFR (Dimitris)
        long: When multiple height sources are enabled at the same time, the height
          estimate will always converge towards the reference height source selected
          by this parameter. The range sensor and vision options should only be used
          when for operation over a flat surface as the local NED origin will move
