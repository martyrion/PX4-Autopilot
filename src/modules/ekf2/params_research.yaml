    EKF2_0_IMU:
      description:
          short: EKF2 Instance 0 IMU selection
          long: |
              IMU sensor index for EKF2 instance 0.
              Instance 0 is always created.
      type: int32
      values:
          0: IMU 0
          1: IMU 1
          2: IMU 2
          3: IMU 3
      default: 0
      min: 0
      max: 3
    EKF2_0_MAG:
